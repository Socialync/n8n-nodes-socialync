# Publishes this n8n community node package to npm on every version tag push,
# with an npm provenance statement. n8n requires this for verified community
# nodes (from 1 May 2026): https://docs.n8n.io/integrations/creating-nodes/deploy/submit-community-nodes/
#
# One time setup: keep this file at .github/workflows/publish.yml in this
# package's public repository, and add a Trusted Publisher on npmjs.com for the
# workflow file name publish.yml.
#
# Needs @n8n/node-cli 0.23.0 or later as a devDependency.
name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Mints the OIDC token npm uses for the provenance statement.
      id-token: write
      contents: read

    # Actions are pinned to a full commit SHA, with the release in the trailing
    # comment: a tag such as @v4 can be moved to new code, a SHA cannot.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The job's token is read only (contents: read above), so it could
          # never push; this also keeps it out of the checkout while the
          # install and release scripts run.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release
        # Lint and build run as part of the release script.
        # With a Trusted Publisher configured on npm, leave NPM_TOKEN unset.
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
